name: Bug report
description: Report a reproducible scan, UI, compatibility, or cleanup problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove private playlist/account information from screenshots and logs. Use a disposable playlist when reproducing cleanup issues.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 152..."
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: YouTube UI language
      placeholder: "English (US)"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options:
        - Opening/page recognition
        - Full playlist loading
        - Duplicate scan
        - Review/UI
        - Cleanup/removal
        - Verification
        - Report/CSV
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Do not include a private playlist URL.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / exact extension message
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Relevant console output
      description: Remove cookies, tokens, IDs, private URLs, and account details.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I used (or can use) a disposable playlist to reproduce destructive-action issues.
          required: true
        - label: I removed private account/playlist information from this report.
          required: true
