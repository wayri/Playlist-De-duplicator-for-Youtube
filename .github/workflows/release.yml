name: Build and publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Publishing is deliberate: a normal documentation/code push only validates.
    # A commit whose subject starts with "Release v" or a manual dispatch can publish.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate extension and repository
        run: npm test

      - name: Build release archives
        run: bash ./scripts/package.sh

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release notes exist
        shell: bash
        run: test -f "docs/releases/v${{ steps.version.outputs.version }}.md"

      - name: Create GitHub release and upload installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" \
            "dist/playlist-deduper-for-youtube-v${VERSION}-offline.zip" \
            "dist/playlist-deduper-for-youtube-v${VERSION}-store.zip" \
            "dist/playlist-deduper-for-youtube-v${VERSION}-source.zip" \
            --target "$GITHUB_SHA" \
            --title "Playlist Deduper for YouTube™ v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md"
