name: Build release draft

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tested commit SHA to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - name: Validate and test behavior
        run: npm test
      - name: Build release archives
        run: node scripts/package.mjs
      - name: Independently inspect archives
        run: python scripts/check-archives.py
      - name: Resolve version
        id: version
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create draft with installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          test -f "docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/playlist-deduper-for-youtube-v${VERSION}-offline.zip" \
            "dist/playlist-deduper-for-youtube-v${VERSION}-store.zip" \
            "dist/playlist-deduper-for-youtube-v${VERSION}-source.zip" \
            dist/SHA256SUMS.txt \
            --draft --target "$GITHUB_SHA" \
            --title "Playlist Deduper for YouTube v${VERSION}" \
            --notes-file "docs/releases/$TAG.md"
